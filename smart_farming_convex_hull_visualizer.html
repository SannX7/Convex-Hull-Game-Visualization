<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farming IoT - Convex Hull Brute Force</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120; /* Deep dark blue/gray */
            color: #f8fafc;
            overflow: hidden;
        }
        .font-mono {
            font-family: 'Fira Code', monospace;
        }
        
        /* Grid background for the canvas area */
        .canvas-container {
            background-color: #0b1120;
            background-image: 
                linear-gradient(to right, rgba(34, 197, 94, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(34, 197, 94, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Scrollbar styling for telemetry log */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(34, 197, 94, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(34, 197, 94, 0.6); }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Glass panel styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row">

    <!-- LEFT PANEL: Controls & Telemetry -->
    <aside class="w-full md:w-[400px] h-full flex flex-col border-r border-green-500/20 glass-panel shadow-2xl shadow-green-900/20 z-10 shrink-0">
        
        <!-- Header -->
        <div class="p-5 border-b border-green-500/20 bg-slate-900/50">
            <div class="flex items-center gap-3 mb-1">
                <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_#22c55e]"></div>
                <h1 class="text-sm font-bold tracking-widest text-green-400 uppercase">IoT Geofencing</h1>
            </div>
            <h2 class="text-xl font-semibold text-slate-100">Convex Hull Vis.</h2>
            <p class="text-xs text-slate-400 mt-1">Algoritma Brute Force <span class="font-mono text-green-300 bg-green-900/30 px-1 rounded">O(n³)</span></p>
        </div>

        <!-- Controls -->
        <div class="p-5 flex flex-col gap-3 border-b border-green-500/20">
            <div class="grid grid-cols-2 gap-2">
                <button id="btnPreset" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-xs font-medium rounded transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
                    Preset (Slide 3)
                </button>
                <button id="btnRandom" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-xs font-medium rounded transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                    Sensor Acak
                </button>
            </div>
            
            <button id="btnClear" class="px-3 py-1.5 bg-red-950/40 hover:bg-red-900/60 border border-red-800/50 text-red-300 text-xs font-medium rounded transition w-full">
                Bersihkan Kanvas
            </button>

            <div class="mt-2">
                <label class="text-xs text-slate-400 mb-1 flex justify-between">
                    <span>Kecepatan Animasi</span>
                    <span id="speedDisplay" class="font-mono text-green-400">Normal</span>
                </label>
                <input type="range" id="speedSlider" min="1" max="100" value="50" class="w-full accent-green-500 cursor-pointer">
            </div>

            <button id="btnStart" class="mt-2 px-4 py-3 bg-green-600 hover:bg-green-500 shadow-[0_0_15px_rgba(34,197,94,0.4)] text-white text-sm font-bold rounded transition flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                MULAI BRUTE FORCE
            </button>
        </div>

        <!-- Live Telemetry / Math Log -->
        <div class="flex-1 flex flex-col min-h-0">
            <div class="p-3 border-b border-green-500/20 bg-slate-900/80 flex justify-between items-center">
                <span class="text-xs font-semibold text-slate-300 uppercase">Live Math Log</span>
                <span id="sensorCount" class="text-xs font-mono text-green-400">0 Sensors</span>
            </div>
            
            <div id="logContainer" class="flex-1 overflow-y-auto p-4 space-y-3 font-mono text-[11px] leading-relaxed bg-[#050810]">
                <div class="text-slate-500 italic text-center mt-10">
                    Tambahkan sensor di kanvas lalu klik Mulai.
                </div>
            </div>
        </div>

    </aside>

    <!-- RIGHT PANEL: Canvas -->
    <main class="flex-1 relative canvas-container" id="canvasWrapper">
        <canvas id="appCanvas"></canvas>
        
        <!-- On-canvas instructions -->
        <div class="absolute top-6 left-6 pointer-events-none">
            <div class="px-4 py-2 bg-slate-900/80 backdrop-blur border border-slate-700 rounded-lg shadow-lg">
                <p class="text-xs text-slate-300">
                    <span class="font-bold text-green-400">Klik</span> untuk menambah Sensor IoT.
                </p>
            </div>
        </div>
    </main>

    <script>
        /** 
         * SMART FARMING CONVEX HULL BRUTE FORCE VISUALIZER
         * Async/Await implementation for step-by-step animation
         */
         
        // --- UI & Canvas Setup ---
        const canvas = document.getElementById('appCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const logContainer = document.getElementById('logContainer');
        const sensorCountEl = document.getElementById('sensorCount');
        const speedSlider = document.getElementById('speedSlider');
        const speedDisplay = document.getElementById('speedDisplay');
        const btnStart = document.getElementById('btnStart');
        const btnClear = document.getElementById('btnClear');
        const btnPreset = document.getElementById('btnPreset');
        const btnRandom = document.getElementById('btnRandom');

        let width, height;
        let points = [];
        let isAnimating = false;
        let abortAnimation = false;

        // Visual States for Rendering
        let hullEdges = [];        // Permanent valid edges (green)
        let activeLine = null;     // {p1, p2, status: 'testing'|'invalid'|'valid'}
        let activeTestPoint = null;// {p, D}
        let testedPoints = [];     // Points already tested for the current line {p, D}

        // --- Math & Helper Functions ---
        function getLabel(idx) {
            return String.fromCharCode(65 + (idx % 26)) + (idx >= 26 ? Math.floor(idx/26) : '');
        }

        function resize() {
            width = canvasWrapper.clientWidth;
            height = canvasWrapper.clientHeight;
            // Handle high-DPI displays for crisp rendering
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            render();
        }
        window.addEventListener('resize', resize);

        // Add Point on Click
        canvas.addEventListener('mousedown', (e) => {
            if (isAnimating) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            points.push({ x, y, label: getLabel(points.length) });
            updateUI();
            render();
        });

        function clearData() {
            abortAnimation = true;
            isAnimating = false;
            points = [];
            hullEdges = [];
            activeLine = null;
            activeTestPoint = null;
            testedPoints = [];
            logContainer.innerHTML = '<div class="text-slate-500 italic text-center mt-10">Kanvas dibersihkan. Tambahkan sensor baru.</div>';
            updateUI();
            render();
        }

        function loadPreset() {
            clearData();
            abortAnimation = false; // Reset abort flag
            const cx = width / 2;
            const cy = height / 2;
            const size = Math.min(width, height) * 0.25;

            // Square-ish shape with one point in the exact center
            points = [
                { x: cx - size, y: cy - size, label: 'A' },
                { x: cx + size, y: cy - size, label: 'B' },
                { x: cx + size, y: cy + size, label: 'C' },
                { x: cx - size, y: cy + size, label: 'D' },
                { x: cx, y: cy, label: 'E' } // Eliminated point
            ];
            updateUI();
            render();
            appendLog('Menyiapkan Skenario Preset (Slide 3)...', 'text-cyan-400');
        }

        function loadRandom() {
            clearData();
            abortAnimation = false;
            const padding = 50;
            for (let i = 0; i < 8; i++) {
                points.push({
                    x: padding + Math.random() * (width - padding * 2),
                    y: padding + Math.random() * (height - padding * 2),
                    label: getLabel(i)
                });
            }
            updateUI();
            render();
            appendLog(`Membentuk ${points.length} Sensor Acak.`, 'text-amber-400');
        }

        function updateUI() {
            sensorCountEl.innerText = `${points.length} Sensor`;
            btnStart.disabled = points.length < 3 || isAnimating;
            btnStart.className = btnStart.disabled 
                ? "mt-2 px-4 py-3 bg-slate-700 text-slate-500 text-sm font-bold rounded flex items-center justify-center gap-2 cursor-not-allowed"
                : "mt-2 px-4 py-3 bg-green-600 hover:bg-green-500 shadow-[0_0_15px_rgba(34,197,94,0.4)] text-white text-sm font-bold rounded transition flex items-center justify-center gap-2 cursor-pointer";
        }

        // --- Logging System ---
        function appendLog(htmlContent, colorClass = 'text-slate-300') {
            const el = document.createElement('div');
            el.className = `border-l-2 border-slate-700 pl-3 py-1 ${colorClass}`;
            el.innerHTML = htmlContent;
            logContainer.appendChild(el);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function clearLog() {
            logContainer.innerHTML = '';
        }

        // --- Animation Control ---
        function getDelay() {
            // Slider 1 (slow) to 100 (fast). 
            // 1 -> 1500ms, 50 -> 400ms, 100 -> 10ms
            const speed = parseInt(speedSlider.value);
            if (speed < 30) speedDisplay.innerText = "Lambat";
            else if (speed < 70) speedDisplay.innerText = "Normal";
            else speedDisplay.innerText = "Cepat";

            const minDelay = 10;
            const maxDelay = 1500;
            // Exponential scale for smoother feel
            const ratio = (speed - 1) / 99; // 0 to 1
            return maxDelay - (maxDelay - minDelay) * Math.pow(ratio, 0.5);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // --- Core Algorithm (Async/Await) ---
        async function runBruteForce() {
            if (points.length < 3) return;
            
            isAnimating = true;
            abortAnimation = false;
            updateUI();
            clearLog();
            
            hullEdges = [];
            activeLine = null;
            activeTestPoint = null;
            testedPoints = [];
            
            appendLog(`Mulai Algoritma Brute Force untuk ${points.length} Sensor.`, 'text-green-400 font-bold text-xs');
            appendLog(`Kompleksitas: O(n³)`, 'text-slate-400');

            const n = points.length;

            for (let i = 0; i < n; i++) {
                for (let j = i + 1; j < n; j++) {
                    if (abortAnimation) return;

                    const pi = points[i];
                    const pj = points[j];

                    // Reset test arrays
                    testedPoints = [];
                    activeTestPoint = null;

                    // Set active testing line (Yellow Dashed)
                    activeLine = { p1: pi, p2: pj, status: 'testing' };
                    
                    // Math parameters for line ax + by = c
                    const a = pj.y - pi.y;
                    const b = pi.x - pj.x;
                    const c = pi.x * pj.y - pi.y * pj.x;

                    appendLog(`<br/><span class="text-yellow-400">--- Uji Garis ${pi.label} → ${pj.label} ---</span>`);
                    appendLog(`<span class="text-slate-400">Persamaan: </span>a=${Math.round(a)}, b=${Math.round(b)}, c=${Math.round(c)}`);
                    
                    render();
                    await sleep(getDelay() * 1.5);

                    let hasPos = false; // D > 0 (Left side mathematically)
                    let hasNeg = false; // D < 0 (Right side mathematically)
                    let lineValid = true;

                    // Test all other points K
                    for (let k = 0; k < n; k++) {
                        if (abortAnimation) return;
                        if (k === i || k === j) continue;

                        const pk = points[k];
                        const D = (a * pk.x) + (b * pk.y) - c;
                        
                        activeTestPoint = { p: pk, D: D };
                        
                        let sideStr = "";
                        let colorClass = "";
                        if (D > 0) {
                            hasPos = true;
                            sideStr = `> 0 (Biru)`;
                            colorClass = "text-cyan-400";
                        } else if (D < 0) {
                            hasNeg = true;
                            sideStr = `< 0 (Oranye)`;
                            colorClass = "text-orange-400";
                        } else {
                            sideStr = `= 0 (Segaris)`;
                            colorClass = "text-slate-400";
                        }

                        appendLog(`Cek Pk(${pk.label}): D = ${Math.round(D)} <span class="${colorClass}">${sideStr}</span>`);

                        render();
                        await sleep(getDelay());

                        // Move point to tested list
                        testedPoints.push(activeTestPoint);
                        activeTestPoint = null;

                        // OPTIMIZATION & LOGIC BREAK:
                        // If we found points on BOTH sides, this line cannot be the outer hull.
                        if (hasPos && hasNeg) {
                            lineValid = false;
                            appendLog(`✗ Sensor tersebar di 2 sisi. Garis ${pi.label}-${pj.label} ELIMINASI.`, 'text-red-400 font-bold');
                            
                            activeLine.status = 'invalid';
                            render();
                            await sleep(getDelay() * 1.5);
                            break; // Stop checking further points for this line
                        }
                    }

                    if (abortAnimation) return;

                    // Finalize edge
                    if (lineValid) {
                        appendLog(`✓ Seluruh sensor di 1 sisi. Garis ${pi.label}-${pj.label} VALID!`, 'text-green-400 font-bold');
                        activeLine.status = 'valid';
                        render();
                        await sleep(getDelay() * 1.5);
                        
                        // Save to permanent hull
                        hullEdges.push({ p1: pi, p2: pj });
                    }

                    // Clean up for next pair
                    activeLine = null;
                    testedPoints = [];
                    render();
                }
            }

            if (!abortAnimation) {
                appendLog(`<br/>====================<br/>PROSES SELESAI!<br/>Total Garis Perimeter: ${hullEdges.length}`, 'text-green-400 font-bold text-sm');
                isAnimating = false;
                updateUI();
                render();
            }
        }

        // --- Render Engine ---
        function render() {
            // Clear canvas (background handles CSS grid)
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Permanent Hull Edges (Green Glow)
            if (hullEdges.length > 0) {
                ctx.save();
                ctx.strokeStyle = '#22c55e'; // neon green
                ctx.lineWidth = 3;
                ctx.lineJoin = 'round';
                ctx.shadowColor = '#22c55e';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                hullEdges.forEach(edge => {
                    ctx.moveTo(edge.p1.x, edge.p1.y);
                    ctx.lineTo(edge.p2.x, edge.p2.y);
                });
                ctx.stroke();
                ctx.restore();
            }

            // 2. Draw Active Testing Line
            if (activeLine) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(activeLine.p1.x, activeLine.p1.y);
                ctx.lineTo(activeLine.p2.x, activeLine.p2.y);

                if (activeLine.status === 'testing') {
                    ctx.strokeStyle = '#eab308'; // yellow
                    ctx.lineWidth = 2;
                    ctx.setLineDash([8, 8]);
                    // Extend line to infinity visually for better understanding
                    const dx = activeLine.p2.x - activeLine.p1.x;
                    const dy = activeLine.p2.y - activeLine.p1.y;
                    ctx.moveTo(activeLine.p1.x - dx*10, activeLine.p1.y - dy*10);
                    ctx.lineTo(activeLine.p2.x + dx*10, activeLine.p2.y + dy*10);
                } else if (activeLine.status === 'invalid') {
                    ctx.strokeStyle = '#ef4444'; // red
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 10;
                } else if (activeLine.status === 'valid') {
                    ctx.strokeStyle = '#22c55e'; // green
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#22c55e';
                    ctx.shadowBlur = 10;
                }
                
                ctx.stroke();
                ctx.restore();
            }

            // 3. Draw All Points (Sensors)
            points.forEach(p => {
                let pointColor = '#64748b'; // Default slate
                let isTestingP1P2 = false;

                // Color overrides based on state
                if (activeLine && (p === activeLine.p1 || p === activeLine.p2)) {
                    pointColor = '#eab308'; // Yellow for Pi, Pj
                    isTestingP1P2 = true;
                } else {
                    // Check if it's in the tested points
                    const tPoint = testedPoints.find(tp => tp.p === p);
                    if (tPoint) {
                        pointColor = tPoint.D > 0 ? '#06b6d4' : (tPoint.D < 0 ? '#f97316' : '#94a3b8'); // Blue or Orange
                    } else if (activeTestPoint && activeTestPoint.p === p) {
                        pointColor = '#ffffff'; // White flash while testing
                    }
                }

                // If simulation is done and it's part of the hull, make it green
                if (!isAnimating && !activeLine && hullEdges.length > 0) {
                    const isHullVertex = hullEdges.some(e => e.p1 === p || e.p2 === p);
                    if (isHullVertex) pointColor = '#22c55e';
                }

                // Draw Point Glow
                ctx.beginPath();
                ctx.arc(p.x, p.y, isTestingP1P2 ? 14 : 10, 0, Math.PI * 2);
                ctx.fillStyle = pointColor;
                ctx.globalAlpha = 0.2;
                ctx.fill();
                
                // Draw Core
                ctx.globalAlpha = 1.0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = pointColor;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();

                // Draw Label
                ctx.font = '600 12px Inter';
                ctx.fillStyle = '#f8fafc';
                ctx.fillText(p.label, p.x + 10, p.y - 10);
            });

            // 4. Draw Testing Indicator (Line from active edge to Pk)
            if (activeLine && activeTestPoint) {
                const pk = activeTestPoint.p;
                const midX = (activeLine.p1.x + activeLine.p2.x) / 2;
                const midY = (activeLine.p1.y + activeLine.p2.y) / 2;
                
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(midX, midY);
                ctx.lineTo(pk.x, pk.y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.setLineDash([4, 4]);
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
            }
        }

        // --- Event Listeners Mapping ---
        btnStart.addEventListener('click', runBruteForce);
        btnClear.addEventListener('click', clearData);
        btnPreset.addEventListener('click', loadPreset);
        btnRandom.addEventListener('click', loadRandom);
        speedSlider.addEventListener('input', getDelay);

        // Initial setup
        resize();
        loadPreset();

    </script>
</body>
</html>
